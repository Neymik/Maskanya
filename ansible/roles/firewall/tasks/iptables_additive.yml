---
# Surgical iptables additions for shared-use hosts. Never flush. Never touch
# DOCKER, DOCKER-USER, f2b-sshd, ispmgr_*, or policy. Every add is guarded by
# `iptables -C` so re-runs are idempotent.

- name: Ensure iptables is present (usually already there under Docker)
  ansible.builtin.apt:
    name: iptables
    state: present

- name: Deploy maskanya-iptables-rules.sh
  ansible.builtin.template:
    src: maskanya-iptables-rules.sh.j2
    dest: /usr/local/sbin/maskanya-iptables-rules.sh
    owner: root
    group: root
    mode: "0755"
  notify: reload maskanya iptables

- name: Install systemd oneshot unit
  ansible.builtin.copy:
    src: maskanya-iptables.service
    dest: /etc/systemd/system/maskanya-iptables.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd daemon

- name: Enable and start maskanya-iptables oneshot
  ansible.builtin.systemd:
    name: maskanya-iptables.service
    state: started
    enabled: true
    daemon_reload: true
