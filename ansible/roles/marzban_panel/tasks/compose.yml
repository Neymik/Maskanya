---
- name: Assert Docker is already present (we never install it here — ZOV already runs 20+ containers)
  ansible.builtin.command: docker version --format '{% raw %}{{ .Server.Version }}{% endraw %}'
  register: docker_version
  changed_when: false
  failed_when: docker_version.rc != 0

# On hosts running docker.io from Ubuntu's repo (e.g. ZOV), the Compose V2 CLI
# plugin is not shipped. community.docker.docker_compose_v2 requires it. We
# drop the official binary into /usr/local/lib/docker/cli-plugins — a plugin-only
# location that doesn't touch the daemon config (preserve_docker safe).
- name: Check for docker compose plugin
  ansible.builtin.command: docker compose version
  register: docker_compose_check
  changed_when: false
  failed_when: false

- name: Install Docker Compose V2 CLI plugin (if absent)
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-x86_64"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    owner: root
    group: root
    mode: "0755"
  when: docker_compose_check.rc != 0

- name: Ensure marzban install dir exists
  ansible.builtin.file:
    path: "{{ marzban_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render .env (contains admin + DB credentials)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ marzban_install_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ marzban_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Start / converge the Marzban compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ marzban_install_dir }}"
    state: present
    wait: true
    wait_timeout: 180

- name: Wait for Marzban API to respond on mesh
  # /openapi.json is FastAPI's built-in schema dump — present whenever the
  # ASGI app is mounted, independent of UI builds. /docs and /health were
  # dropped in Marzban ≥ 0.8.
  # HTTPS because Marzban only binds non-loopback when SSL is configured.
  # validate_certs: no — we reach it via mesh IP; SNI wouldn't match and
  # cert verification adds no value on the loopback-equivalent link.
  ansible.builtin.uri:
    url: "https://{{ marzban_listen_address }}:{{ marzban_listen_port }}/openapi.json"
    status_code: [200]
    validate_certs: no
  register: marzban_health
  retries: 30
  delay: 2
  until: marzban_health.status == 200
