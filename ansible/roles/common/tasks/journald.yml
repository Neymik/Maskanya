---
- name: Ensure journald drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Maskanya journald drop-in
  ansible.builtin.template:
    src: journald-maskanya.conf.j2
    dest: /etc/systemd/journald.conf.d/00-maskanya.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart journald
