---
# sshd stays on port 22. Hardening is via directives: pubkey-only, no root,
# MaxAuthTries 3. No Port change means no socket-activation dance is needed.

- name: Ensure sshd drop-in dir exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy hardened sshd drop-in
  ansible.builtin.template:
    src: sshd_config_maskanya.j2
    dest: /etc/ssh/sshd_config.d/00-maskanya.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: restart sshd

- name: Mask conflicting stock sshd_config lines (our drop-in wins anyway, but clarity > surprise)
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '^[#\s]*({{ item }})\s+.*$'
    replace: '# \1 — overridden by /etc/ssh/sshd_config.d/00-maskanya.conf'
  loop:
    - PermitRootLogin
    - PasswordAuthentication
    - KbdInteractiveAuthentication
    - ChallengeResponseAuthentication
    - MaxAuthTries
  notify: restart sshd
