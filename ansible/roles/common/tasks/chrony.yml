---
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Stop and disable systemd-timesyncd (chrony takes over)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  failed_when: false  # unit may legitimately be absent on minimal images

- name: Deploy chrony.conf
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chrony

- name: Enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
