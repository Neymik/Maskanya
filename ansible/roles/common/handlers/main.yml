---
- name: restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
