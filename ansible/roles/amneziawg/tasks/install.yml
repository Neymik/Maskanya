---
- name: Add AmneziaWG PPA
  ansible.builtin.apt_repository:
    repo: ppa:amnezia/ppa
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install amneziawg (kernel module) + tools
  ansible.builtin.apt:
    name:
      - amneziawg
      - amneziawg-tools
    state: present

- name: Ensure /etc/amneziawg exists (0700)
  ansible.builtin.file:
    path: /etc/amneziawg
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Load amneziawg kernel module now
  community.general.modprobe:
    name: amneziawg
    state: present

- name: Persist amneziawg module across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/amneziawg.conf
    owner: root
    group: root
    mode: "0644"
    content: "amneziawg\n"
