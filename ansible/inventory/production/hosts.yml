---
# Maskanya production inventory.
#
# Host aliases match ~/.ssh/config entries, so Ansible inherits whatever User/Port/IdentityFile
# the operator has configured there. For first-contact bootstrap, override on the CLI:
#   ansible-playbook playbooks/bootstrap.yml --limit MaskanyaHopMsk -u root -e ansible_port=22
# After the common role creates the admin user and moves SSH to admin_ssh_port, runs proceed
# with the inventory defaults below.

all:
  vars:
    ansible_user: admin
    ansible_python_interpreter: /usr/bin/python3
    ansible_port: "{{ admin_ssh_port }}"

  children:
    mgmt:
      hosts:
        ZenithOfVastness:

    entries:
      hosts:
        MaskanyaHopMsk:

    exits:
      hosts:
        ZenithOfVastness:  # dual-role mgmt + exit during invite-only phase
        MaskanyaExitKZ1:
