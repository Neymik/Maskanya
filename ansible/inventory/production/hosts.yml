---
# Maskanya production inventory.
#
# Host aliases here match ~/.ssh/config entries verbatim. Ansible's OpenSSH
# connection plugin reads ~/.ssh/config by default (ansible.cfg does NOT pass
# -F), so User / Port / HostName / IdentityFile come from there — this file
# stays free of connection details.
#
# For first-contact bootstrap against a fresh provider image (before the ssh
# config alias exists), override on the CLI, e.g.:
#   ansible-playbook playbooks/bootstrap.yml --limit <Host> \
#     -e 'ansible_host=<ip> ansible_user=root ansible_port=<provider_port>'
# Once the alias is added to ~/.ssh/config, runs use the defaults below.

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # ansible_user / ansible_port / IdentityFile all come from ~/.ssh/config
    # via the host alias. Do not override here without a specific reason.

  children:
    mgmt:
      hosts:
        ZenithOfVastness:

    entries:
      hosts:
        MaskanyaHopMsk:

    exits:
      hosts:
        ZenithOfVastness:  # dual-role mgmt + exit during invite-only phase
        MaskanyaExitKZ1:
