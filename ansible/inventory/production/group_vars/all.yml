---
# Global variables shared by every host in the production inventory.
# Per-host overrides live in host_vars/.

# --- Identity / access -------------------------------------------------------

# The operator's public SSH key(s) installed into the admin user's authorized_keys.
# Pulled from the operator's local ~/.ssh at Ansible runtime — never committed to git.
admin_authorized_keys:
  - "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"
  # Additional keys (if you have them) can be appended as more file lookups or
  # literal "ssh-ed25519 AAAA... user@host" strings.

admin_user: admin
# Keep sshd on port 22 — security is via pubkey-only + no-root; port obscurity
# adds fragility (ssh.socket on Ubuntu 22.10+ binds :22 regardless of sshd_config)
# without meaningful benefit.
admin_ssh_port: 22

# --- Domains -----------------------------------------------------------------

base_domain: maskanya.animeenigma.ru
sub_domain: "sub.{{ base_domain }}"       # public subscription endpoint
panel_domain: "panel.{{ base_domain }}"   # Marzban UI (mesh-only)
grafana_domain: "grafana.{{ base_domain }}"  # Grafana (mesh-only, Phase 2)
operator_acme_email: 0neymik0@gmail.com

# --- AmneziaWG control mesh --------------------------------------------------

awg_interface: awg1                # namespaced so ZOV's unrelated awg0 coexists
awg_subnet: 10.77.0.0/24
awg_subnet_prefix: 24
awg_listen_port: 51821             # 51820 taken by ZOV's existing awg0
awg_hub_address: 10.77.0.1         # ZenithOfVastness

# AmneziaWG obfuscation parameters — identical across every peer in the mesh.
# Deliberately not the AmneziaVPN-app defaults, so signatures don't overlap with
# the consumer app's mesh.
awg_junk_params:
  Jc: 7      # 3-10: random junk packet count per handshake
  Jmin: 80   # min junk payload size
  Jmax: 750  # max junk payload size
  S1: 95     # init-packet prepend size (bytes)
  S2: 145    # response-packet prepend size (bytes)
  H1: 1195723975  # magic uint32 replacements for WG header type fields (must all differ)
  H2: 2359486331
  H3: 3089521197
  H4: 1847320456

# --- Reality decoy pool ------------------------------------------------------
#
# Per-node randomized at provisioning time. Entry and exit on the same chain MUST
# use different SNIs (compartmentalization). Requirements for any new entry:
#   - TLS 1.3, HTTP/2, X25519 keyshare
#   - not blocked from Russia
#   - not US-owned (avoid collateral RKN blocks on US tech brands)
#   - reachable from the entry/exit node itself (Reality steals from the real
#     server over TCP — an SNI blocked from that node fails silently)
#
# Pool split by client-vantage: for clients inside RU, RU-accessible SNIs match
# a plausible residential fingerprint and avoid the post-Dec-2025 TSPU
# "low-plausibility destination" heuristic. JP/KR entries are retained for
# future non-RU client scenarios. Whenever a node is pinned to a decoy, verify
# TLS 1.3 + H2 + X25519 from the node with openssl s_client before committing.

reality_decoy_pool:
  # Non-RU neutral-country decoys (for non-RU-vantage scenarios)
  - www.lovelive-anime.jp
  - www.nintendo.co.jp
  - www.sony.jp
  - www.asus.com
  - www.samsung.com
  - www.lg.com
  - www.naver.com
  - www.kakao.com
  # RU-accessible decoys (preferred for RU-vantage clients, added 2026-04-21
  # after the Dec-2025 TSPU detector shift). Each verified TLS 1.3 + H2 + X25519
  # from MSK and ZOV.
  - api-maps.yandex.ru
  - eh.vk.ru
  - max.ru
  - dzen.ru

# --- Versions ----------------------------------------------------------------

xray_version: "25.12.8"
node_exporter_version: "1.8.2"
node_exporter_port: 9100   # bound to mesh IP by the role, not 0.0.0.0

# xray stats API — dokodemo-door listener on mesh IP. Same port on every host.
xray_entry_api_port: 10085
xray_exit_api_port: 10085

# Decrypted Phase-1 user + chain-link UUIDs from secrets/xray_clients.yml.
# The lookup runs on the controller at runtime; the decrypted content never
# lands on disk. Will be retired in Phase 1.5 when Marzban becomes source of truth.
xray_clients: "{{ lookup('community.sops.sops', inventory_dir + '/../../../secrets/xray_clients.yml') | from_yaml }}"

# --- Time sync ---------------------------------------------------------------

chrony_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"
  - "2.pool.ntp.org"
  - "time.cloudflare.com"

# --- Default preservation flags (dedicated Maskanya nodes) -------------------
# ZenithOfVastness overrides these to `true` in host_vars — it carries 20+
# unrelated Docker containers, 13 production nginx vhosts, an existing awg0
# mesh, certbot, fail2ban, and timesyncd that we must not disturb.

preserve_nginx: false
preserve_iptables: false
preserve_awg0: false
preserve_timesyncd: false
preserve_fail2ban: false
preserve_docker: false
preserve_x_ui: false
preserve_journald: false
# SSH / user-account hygiene on ZOV is also sacred — the operator already has
# working pubkey access as root that predates Maskanya. We leave sshd_config
# and authorized_keys alone on any host with preserve_ssh / preserve_admin_user.
preserve_ssh: false
preserve_admin_user: false

# --- Maskanya project filesystem root ----------------------------------------
# Where Maskanya-owned state lives on the host (compose files, backups, etc.).
# On dedicated nodes we use /opt/maskanya. On ZenithOfVastness we override to
# /data/Maskanya because root fs is 81% full and /data is the spacious volume.
maskanya_project_root: /opt/maskanya
