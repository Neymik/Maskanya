---
# Variables applied to the management host (currently ZenithOfVastness).
#
# Secrets are resolved via the community.sops lookup; files live in
# <repo>/secrets/ and are anchored via inventory_dir so the path works from
# any playbook location (site.yml, ad-hoc, CI).

marzban_version: "v0.8.4"
mariadb_image: "mariadb:11.4"

marzban_install_dir: "{{ maskanya_project_root }}/marzban"
marzban_listen_address: "{{ awg_address }}"   # mesh-only
# 8880, not 8000: ZOV's unrelated `predictdota2_web_1` container publishes
# 0.0.0.0:8000 → its own container. Its DOCKER-chain DNAT rule has no
# destination-IP qualifier, so it catches traffic destined for 10.77.0.1:8000
# before Marzban's more specific `-d 10.77.0.1/32 --dport 8000` rule is ever
# evaluated. Using a distinct host port sidesteps the ordering issue entirely.
marzban_listen_port: 8880

# SOPS-backed credential vars (decrypted at reference time).
_marzban_admin: "{{ lookup('community.sops.sops', inventory_dir + '/../../../secrets/marzban_admin.yml') | from_yaml }}"
_mariadb: "{{ lookup('community.sops.sops', inventory_dir + '/../../../secrets/mariadb.yml') | from_yaml }}"

marzban_admin_username: "{{ _marzban_admin.username }}"
marzban_admin_password: "{{ _marzban_admin.password }}"

mariadb_root_password: "{{ _mariadb.root_password }}"
mariadb_marzban_password: "{{ _mariadb.marzban_password }}"

# Subscription endpoint config (integrated into existing nginx on ZOV).
subscription_public_host: "{{ sub_domain }}"
# HTTPS because Marzban only binds non-loopback when SSL is configured (see
# env.j2). nginx still terminates the external TLS; this is nginx→marzban.
subscription_upstream: "https://{{ awg_hub_address }}:{{ marzban_listen_port }}"
