---
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax-check playbooks (if present)
        working-directory: ansible
        run: |
          shopt -s nullglob
          found=0
          for pb in playbooks/*.yml; do
            found=1
            echo "Checking $pb"
            ansible-playbook -i inventory/production/hosts.yml "$pb" --syntax-check
          done
          if [ "$found" = "0" ]; then
            echo "No playbooks yet; skipping syntax-check."
          fi

  sops-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SOPS
        run: |
          SOPS_VERSION=3.9.1
          curl -sLo sops.deb "https://github.com/getsops/sops/releases/download/v$SOPS_VERSION/sops_${SOPS_VERSION}_amd64.deb"
          sudo dpkg -i sops.deb

      - name: Verify SOPS config is parseable
        run: |
          sops --version
          if [ -f .sops.yaml ]; then
            echo ".sops.yaml present:"
            cat .sops.yaml
          fi
          # Real decrypt test requires SOPS_AGE_KEY in repo secrets; smoke test only.
          echo "SOPS binary OK."
